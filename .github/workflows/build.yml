name: Build

on:
  push:
    branches:
      - 'gh-actions'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Run Svelte checks
        run: npm run check
      - name: Build
        run: npm run build
  # Fails when actions.lock is out of sync with the workflows or a locked commit no longer verifies upstream
  verify-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify lockfile
        run: gh actions-lock --verify
