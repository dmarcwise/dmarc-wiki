name: Deploy
run-name: Deploy ${{ github.sha }}

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVER_1: dmw-prod-1.taild99d78.ts.net
      SERVER_2: dmw-prod-2.taild99d78.ts.net
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Run Svelte checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Connect to tailnet
        uses: tailscale/github-action@v4.3.0
        with:
          # Federated identity:
          # - Subject: repo:dmarcwise@175476939/dmarc-wiki@866996742:ref:refs/heads/main
          # - Scope: auth_keys
          # - Tag: tag:ci
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:ci
          # Wait until the servers accept connections from this new node
          ping: ${{ env.SERVER_1 }},${{ env.SERVER_2 }}
      - name: Prepare deploy
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.DEPLOY_PRIVATE_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/*
      - name: Deploy to dmw-prod-1
        run: ./.github/workflows/deploy-step.sh "$SERVER_1"
      - name: Deploy to dmw-prod-2
        run: ./.github/workflows/deploy-step.sh "$SERVER_2"
